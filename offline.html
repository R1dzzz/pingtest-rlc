<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — PingTest by RLC</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #09090a; color: #eef0f2; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 420px; }
    img { height: 72px; width: auto; margin: 0 auto 24px; display: block; }
    .k { font: 600 12px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; color: #c6f432; margin: 0 0 10px; }
    h1 { font-size: 28px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -.02em; }
    p { color: #9097a0; margin: 0 0 20px; }
    button { appearance: none; border: 0; cursor: pointer; background: #c6f432; color: #0a0c00; font: 600 15px system-ui, sans-serif; padding: 12px 22px; min-height: 44px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="" width="54" height="72">
    <p class="k">PingTest by RLC</p>
    <h1 id="t">Anda sedang offline</h1>
    <p id="d">Tes kecepatan membutuhkan koneksi internet. Sambungkan ke Wi-Fi atau data seluler, lalu coba lagi.</p>
    <button id="b" type="button">Coba lagi</button>
  </main>
  <script>
    (function () {
      var lang = 'id';
      try {
        var s = JSON.parse(localStorage.getItem('pingtest-rlc:lang:v1') || 'null');
        if (s && s.manual && (s.lang === 'en' || s.lang === 'id')) lang = s.lang;
        else { var n = (navigator.language || 'id').toLowerCase(); lang = (n.indexOf('id') === 0 || n.indexOf('in') === 0) ? 'id' : 'en'; }
      } catch (e) {}
      if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.title = 'Offline — PingTest by RLC';
        document.getElementById('t').textContent = 'You are offline';
        document.getElementById('d').textContent = 'The speed test needs an internet connection. Connect to Wi-Fi or mobile data, then try again.';
        document.getElementById('b').textContent = 'Try again';
      }
      document.getElementById('b').addEventListener('click', function () { location.href = '/'; });
    })();
  </script>
</body>
</html>
